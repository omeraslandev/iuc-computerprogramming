<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="html, css, basliklar">
    <title>01 - Temel Yapı ve Başlıklar</title>
</head>
<body style="background-color: green;"> <!-- Modern HTML'de 'bgcolor' yerine 'style' niteliği tercih edilir -->

    <h1>H1 Başlık Denemesi</h1> <!-- <hx> serisi başlıklar için kullanılır (en büyük h1, en küçük h6) -->
    <h2>H2 Başlık Denemesi</h2>
    <h3>H3 Başlık Denemesi</h3>
    <h4>H4 Başlık Denemesi</h4>
    <h5>H5 Başlık Denemesi</h5>
    <h6>H6 Başlık Denemesi</h6>

    <p>Bu bir paragraf metnidir (&lt;p&gt; etiketi paragraf yazmak için kullanılır).</p>

    <!-- <br> etiketi alt satıra geçmek (line break) için kullanılır -->
    <br><br><br>

    <p>Yukarıda 3 adet BR etiketi kullandık.</p>

    <!-- title="" niteliği, mouse imleci öğenin üzerine geldiğinde bilgi kutucuğu (tooltip) açar -->
    <h6 title="Title Denemesi.">Mouse ile üzerime gel! (Title Deneme)</h6>

    <hr>
    <a href="index.html">← Ana Menüye Dön</a>
</body>
</html>
