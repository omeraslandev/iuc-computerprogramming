<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>03 - Liste Türleri</title>
</head>
<body>
    <h2>Liste Alıştırmaları</h2>

    <h3>1. Sıralı Liste (Ordered List - &lt;ol&gt;)</h3>
    <!-- Numaralandırılmış (1, 2, 3...) sıralı liste -->
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>

    <h3>2. Sırasız Liste (Unordered List - &lt;ul&gt;)</h3>
    <!-- Madde işaretli (bullet point) liste -->
    <ul>
        <li>Item A</li>
        <li>Item B</li>
    </ul>

    <h3>3. Tanımlama Listesi (Description List - &lt;dl&gt;)</h3>
    <!-- İsim-açıklama ilişkisi kurgulayan girintili liste yapısı -->
    <dl>
        <dt>dt Title (Başlık / Terim)</dt> <!-- Terim adı -->
        <dd>Item X (Açıklama / Değer)</dd> <!-- Terim açıklaması -->
        <dd>Item Y (Açıklama / Değer)</dd>
    </dl>

    <hr>
    <a href="index.html">← Ana Menüye Dön</a>
</body>
</html>
